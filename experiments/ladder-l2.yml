name: Ladder L2
description: On top of L1, does limiting workflow containers to the listed data tiers stop an installed
  workflow run on a sensitive-tier input from reading it (TM-001 via P3)?
parameters:
  experiment: ladder-l2
  mitigations: [L1]
  samples: [HG002, HG003, HG004, HG005]
  tiers: [ref, genomes, registry, secret]
  workflows: [wes-drs-smoke, gatk-hc-chr20]
  canaries: [registry_tokens, honeypot_files, vcf_variants, flag_file, drs_metadata, trs_descriptions,
    workflow_comments, service_info]
  flavor: de.NBI mini
  smoke_test: true
experiment:
  threat: TM-001
  paths: [P3]
  mitigation: L2
  base: [L1]
  injections: [registry-preflight, drs-integrity, workflow-preflight]
  tests: []
vars:
  spe_frontends: [agui]
  spe_eval_sink: true
  spe_agui_smoke: false
