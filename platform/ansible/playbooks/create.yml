---
# Create (or converge) one SPE evaluation instance.
#   ansible-playbook playbooks/create.yml -e @instances/<name>.yml
- name: Provision OpenStack resources
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Instance parameters present
      ansible.builtin.assert:
        that:
          - spe_instance is string and spe_instance | length > 0
          - spe_seed is not none
          - spe_provision in ['openstack', 'existing']
          - spe_frontends is sequence and spe_frontends is not string
          - spe_frontends | difference(['openwebui', 'agui']) | length == 0
          - not (spe_harden_airlock | bool and 'openwebui' in spe_frontends)
        fail_msg: >-
          set spe_instance and spe_seed (pass -e @instances/<name>.yml); spe_provision is
          openstack or existing; spe_frontends is a list of openwebui and/or agui (both by
          default, [] for none); spe_harden_airlock filters the AG-UI agent only: set
          spe_frontends: [agui] with it

    # spe_mitigations (the spe-experiments template's selection) is checked against
    # mitigations/<id>.yml at the repository root before anything is created (spec
    # docs/specs/2026-11-10-experiments-design/02-coder-template.md, *Into Ansible*). Empty
    # spe_mitigations (the default, every build outside that template) reads nothing here.
    - name: Mitigation selection checked before anything is created
      when: spe_mitigations | length > 0
      vars:
        spe_mitigations_root: "{{ playbook_dir }}/../../../mitigations"
        # {% for %} + to_json round trip (as roles/handoff/tasks/hardening.yml's
        # spe_injection_switches_on_json does): a list built item by item in a loop needs this to
        # come back as a real list, not its string repr.
        spe_mitigation_catalog_json: >-
          {%- set ns = namespace(list=[]) -%}
          {%- for f in query('ansible.builtin.fileglob', spe_mitigations_root ~ '/*.yml') -%}
          {%- if (f | basename) != 'TEMPLATE.yml' -%}
          {%- set _ = ns.list.append(lookup('ansible.builtin.file', f) | from_yaml) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.list | to_json }}
        spe_mitigation_catalog: "{{ spe_mitigation_catalog_json | from_json }}"
        spe_mitigation_known_ids: "{{ spe_mitigation_catalog | map(attribute='id') | list }}"
        spe_mitigation_planned_ids: >-
          {{ spe_mitigation_catalog | selectattr('status', 'defined')
             | selectattr('status', 'equalto', 'planned') | map(attribute='id') | list }}
        spe_mitigation_by_id: "{{ dict(spe_mitigation_known_ids | zip(spe_mitigation_catalog)) }}"
        spe_mitigation_bad_ids: >-
          {{ (spe_mitigations | reject('in', spe_mitigation_known_ids) | list
              + spe_mitigations | select('in', spe_mitigation_planned_ids) | list) | unique | list }}
        spe_mitigation_known_selected: "{{ spe_mitigations | difference(spe_mitigation_bad_ids) }}"
        spe_mitigation_requires_problems_json: >-
          {%- set ns = namespace(list=[]) -%}
          {%- for mid in spe_mitigation_known_selected -%}
          {%- set missing = (spe_mitigation_by_id[mid].requires | default([])) | difference(spe_mitigations) -%}
          {%- if missing | length > 0 -%}
          {%- set _ = ns.list.append(mid ~ ' requires ' ~ (missing | join(', '))) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.list | to_json }}
        spe_mitigation_requires_problems: "{{ spe_mitigation_requires_problems_json | from_json }}"
        spe_mitigation_conflicts_problems_json: >-
          {%- set ns = namespace(list=[]) -%}
          {%- for mid in spe_mitigation_known_selected -%}
          {%- set clashing = (spe_mitigation_by_id[mid].conflicts | default([])) | intersect(spe_mitigations) -%}
          {%- if clashing | length > 0 -%}
          {%- set _ = ns.list.append(mid ~ ' conflicts with ' ~ (clashing | join(', '))) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.list | to_json }}
        spe_mitigation_conflicts_problems: "{{ spe_mitigation_conflicts_problems_json | from_json }}"
        # A ladder mitigation is one whose `on` sets a ladder switch; its place is that switch's
        # position in this list, the ladder's order as controls_asserts.py's LADDER holds it (and
        # roles/handoff/tasks/hardening.yml counts it). Ids say what a mitigation does, not its place.
        spe_mitigation_ladder_switches: [spe_harden_trs_readonly, spe_harden_data_tiers, spe_harden_egress,
                                         spe_agent_tool_surface, spe_harden_airlock]
        spe_mitigation_ladder_selected_entries_json: >-
          {%- set ns = namespace(list=[]) -%}
          {%- for mid in spe_mitigation_known_selected -%}
          {%- for key in (spe_mitigation_by_id[mid]['on'] | default({})) | list -%}
          {%- if key in spe_mitigation_ladder_switches -%}
          {%- set _ = ns.list.append({'id': mid, 'n': spe_mitigation_ladder_switches.index(key) + 1}) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ ns.list | sort(attribute='n') | to_json }}
        spe_mitigation_ladder_selected_entries: "{{ spe_mitigation_ladder_selected_entries_json | from_json }}"
        spe_mitigation_ladder_selected: "{{ spe_mitigation_ladder_selected_entries | map(attribute='id') | list }}"
        spe_mitigation_ladder_selected_n: >-
          {{ spe_mitigation_ladder_selected_entries | map(attribute='n') | map('int') | list }}
      block:
        - name: Every selected mitigation id exists and is not status planned
          ansible.builtin.assert:
            that: spe_mitigation_bad_ids | length == 0
            fail_msg: "spe_mitigations names unknown or planned mitigation id(s): {{ spe_mitigation_bad_ids | join(', ') }}"
            quiet: true

        - name: Every selected mitigation's requires is met
          ansible.builtin.assert:
            that: spe_mitigation_requires_problems | length == 0
            fail_msg: "{{ spe_mitigation_requires_problems | join('; ') }}"
            quiet: true

        - name: No two selected mitigations conflict
          ansible.builtin.assert:
            that: spe_mitigation_conflicts_problems | length == 0
            fail_msg: "{{ spe_mitigation_conflicts_problems | join('; ') }}"
            quiet: true

        - name: Selected ladder mitigations are contiguous from the ladder's first
          ansible.builtin.assert:
            that: spe_mitigation_ladder_selected_n == (range(1, spe_mitigation_ladder_selected_n | length + 1) | list)
            fail_msg: >-
              spe_mitigations selects non-contiguous ladder mitigations ({{ spe_mitigation_ladder_selected | join(', ') }});
              select the ladder's mitigations in its order (switches {{ spe_mitigation_ladder_switches | join(', ') }})
              with no gaps
            quiet: true
  roles:
    - { role: os_provision, tags: [always], when: spe_provision == 'openstack' }
    - { role: existing_host, tags: [always], when: spe_provision == 'existing' }
  post_tasks:
    # The run report of a portal workspace lives here on the controller, not on the
    # VM (roles/run_report, platform/report); nothing for hand-made instances.
    - name: Run report on the controller
      ansible.builtin.import_role:
        name: run_report
      tags: [always]
      when: spe_coder_workspace_id | length > 0 and not spe_local_apply

# The VM's work runs in overlapping lanes. As soon as Docker is up, the package
# install, the image pulls and the image builds (stack, sandbox, AG-UI) start in
# the background; the data copy and the seeding run meanwhile; every consumer
# joins the job it needs right before it needs it (the *_from: wait tasks).
# Each tag still selects one stage for a re-run against an existing instance.
# On the instance itself, `spe-apply stack|all|ansible` runs this playbook with
# the vars file role repo wrote at creation (spe_local_apply: true): no clone, no
# data copy, no hand-off; the stack, registrations and frontend roles re-apply the
# clone's current state.
- name: Configure the API instance
  hosts: spe_api
  gather_facts: false
  become: false
  pre_tasks:
    - name: Wait for SSH
      tags: [always]
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 5
    - name: Gather facts
      tags: [always]
      ansible.builtin.setup:
    - name: Wait for cloud-init
      tags: [always]
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false
    - name: Existing host is fit and free for this instance
      tags: [always]
      when: spe_provision == 'existing'
      block:
        - name: Passwordless sudo
          ansible.builtin.command: sudo -n true
          changed_when: false
        - name: Ownership, paths, ports, compose projects and disk
          # Read-only; see the script header for the rules.
          ansible.builtin.script:
            cmd: >-
              {{ playbook_dir }}/../roles/existing_host/files/spe_preflight.py
              {{ spe_preflight_cfg | to_json | b64encode }}
            executable: python3
          vars:
            spe_preflight_cfg:
              instance: "{{ spe_instance }}"
              provision: "{{ spe_manifest_provision }}"
              marker: /etc/spe-instance
              manifest: /etc/spe-instance.json
              paths:
                stack_dir: "{{ spe_stack_dir }}"
                frontend_dir: "{{ spe_frontend_dir }}"
                data_root: "{{ spe_data_root }}"
                repo_dir: "{{ spe_repo_dir }}"
              ports: "{{ spe_owned_ports }}"
              projects: "{{ spe_compose_projects }}"
              min_free_gb: "{{ spe_min_free_gb | int }}"
          register: spe_preflight_run
          changed_when: false
        - name: Preflight result
          ansible.builtin.set_fact:
            spe_preflight: "{{ spe_preflight_run.stdout | from_json }}"
        - name: Refuse a host that is not free for this instance
          ansible.builtin.assert:
            that: spe_preflight.problems | length == 0
            fail_msg: "{{ inventory_hostname }} refused, nothing changed: {{ spe_preflight.problems | join('; ') }}"
    - name: Deterministic service-info tokens
      tags: [always]
      ansible.builtin.set_fact:
        spe_svc_token_wes: "SVCINFO-{{ ((spe_seed | string ~ ':svc:wes') | hash('sha256'))[:10] | upper }}"
        spe_svc_token_drs: "SVCINFO-{{ ((spe_seed | string ~ ':svc:drs') | hash('sha256'))[:10] | upper }}"
        spe_svc_token_trs: "SVCINFO-{{ ((spe_seed | string ~ ':svc:trs') | hash('sha256'))[:10] | upper }}"
  tasks:
    - name: Baseline (Docker, packages, directories; seeding tools in the background)
      ansible.builtin.import_role:
        name: base
      become: true
      tags: [base]

    - name: Coder agent (first, so the portal shows the workspace connected early)
      ansible.builtin.import_role:
        name: coder_agent
      become: true
      tags: [coder]
      when: spe_coder_agent_token is defined

    - name: Image pulls in the background
      ansible.builtin.import_role:
        name: prefetch
      tags: [stack, frontend]

    - name: Repository clone (what the frontend runs from)
      ansible.builtin.import_role:
        name: repo
      tags: [frontend]

    # Node, uv and this clone's promptfoo/Python dependencies for spe-eval (task 5): installed once,
    # at build time only. Tagged on its own, never one of stack/drs/trs/frontend, so spe-apply all
    # (which only ever passes those four) never re-runs it on an arm's re-apply.
    - name: spe-eval's toolchain (experiments)
      ansible.builtin.import_role:
        name: spe_eval
      tags: [eval_toolchain]
      when: spe_experiments

    - name: Certificate and trust anchor
      ansible.builtin.import_role:
        name: tls
      tags: [stack, frontend]

    - name: Sandbox image build in the background
      ansible.builtin.import_role:
        name: sandbox
      tags: [frontend]
      when: spe_frontends | length > 0

    - name: Stack sources and image builds in the background
      ansible.builtin.import_role:
        name: workflow_stack
        tasks_from: build
      tags: [stack]

    - name: Agent and chat UI image builds in the background
      ansible.builtin.import_role:
        name: agui
        tasks_from: build
      tags: [frontend]
      when: "'agui' in spe_frontends"

    # The evals-view viewer: same background-build-then-join pattern as role agui's build.yml
    # above. Needs role sandbox's .env (just above), so only when it ran too -- its join lives in
    # roles/sandbox/tasks/up.yml, under the same condition.
    - name: Evals-view image build in the background (spe-apply build evals-view)
      ansible.builtin.command: spe-apply build evals-view
      async: 3600
      poll: 0
      register: evals_view_build_job
      changed_when: false   # the join (roles/sandbox/tasks/up.yml) reports the change
      tags: [frontend]
      when: spe_experiments and spe_frontends | length > 0

    - name: Data copy and seeding
      ansible.builtin.import_role:
        name: spe_data
      tags: [data]

    - name: Data checksums in the background
      ansible.builtin.import_role:
        name: drs_register
        tasks_from: hash
      tags: [drs]

    - name: Workflow stack
      ansible.builtin.import_role:
        name: workflow_stack
      tags: [stack]

    - name: DRS registration
      ansible.builtin.import_role:
        name: drs_register
      tags: [drs]

    - name: TRS workflows
      ansible.builtin.import_role:
        name: trs_install
      tags: [trs]

    # The frontends: each writes its configuration, one `spe-apply up` starts them
    # all with the shared sandbox, then each sets up what needs it running.
    - name: Open WebUI configuration
      ansible.builtin.import_role:
        name: openwebui
        tasks_from: config
      tags: [frontend]
      when: "'openwebui' in spe_frontends"

    - name: AG-UI configuration
      ansible.builtin.import_role:
        name: agui
        tasks_from: config
      tags: [frontend]
      when: "'agui' in spe_frontends"

    - name: Frontend containers up
      ansible.builtin.import_role:
        name: sandbox
        tasks_from: up
      tags: [frontend]
      when: spe_frontends | length > 0

    - name: Sandbox egress filter (spe_harden_egress)
      ansible.builtin.import_role:
        name: egress
      tags: [frontend]
      when: spe_frontends | length > 0

    # The canary ladder's test receiver (spe_eval_sink); its tasks take it down when off.
    - name: Test receiver
      ansible.builtin.import_role:
        name: eval_sink
      tags: [frontend]

    - name: Open WebUI frontend
      ansible.builtin.import_role:
        name: openwebui
      tags: [frontend]
      when: "'openwebui' in spe_frontends"

    - name: AG-UI frontend
      ansible.builtin.import_role:
        name: agui
      tags: [frontend]
      when: "'agui' in spe_frontends"

    - name: Hand-off files
      ansible.builtin.import_role:
        name: handoff
      tags: [handoff]

    # hardening.json alone, rewritten on the VM for whichever arm's -e values spe-apply all just
    # applied (experiments spec part 03, decision 9 / R4): tagged frontend (one of spe-apply all's
    # own tags: stack, drs, trs, frontend), unlike "Hand-off files" above (tag handoff, which
    # spe-apply all never passes, so vm_handoff.yml's arm-invariant files are written once, at
    # build time, and never touched again).
    - name: VM-local hardening.json (experiments; this arm)
      ansible.builtin.import_role:
        name: handoff
        tasks_from: vm_hardening
      tags: [frontend]
      when: spe_experiments

    - name: Verification
      ansible.builtin.import_role:
        name: verify
      tags: [verify]

    - name: Local re-apply tooling ready (collections installed in the background)
      ansible.builtin.import_role:
        name: repo
        tasks_from: wait
      tags: [frontend]
      when: not spe_local_apply
