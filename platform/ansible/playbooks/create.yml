---
# Create (or converge) one SPE evaluation instance.
#   ansible-playbook playbooks/create.yml -e @instances/<name>.yml
- name: Provision OpenStack resources
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Instance parameters present
      ansible.builtin.assert:
        that:
          - spe_instance is string and spe_instance | length > 0
          - spe_seed is not none
          - spe_provision in ['openstack', 'existing']
          - spe_frontends is sequence and spe_frontends is not string
          - spe_frontends | difference(['openwebui', 'agui']) | length == 0
          - not (spe_harden_airlock | bool and 'openwebui' in spe_frontends)
        fail_msg: >-
          set spe_instance and spe_seed (pass -e @instances/<name>.yml); spe_provision is
          openstack or existing; spe_frontends is a list of openwebui and/or agui (both by
          default, [] for none); spe_harden_airlock filters the AG-UI agent only: set
          spe_frontends: [agui] with it
  roles:
    - { role: os_provision, tags: [always], when: spe_provision == 'openstack' }
    - { role: existing_host, tags: [always], when: spe_provision == 'existing' }
  post_tasks:
    # The run report of a portal workspace lives here on the controller, not on the
    # VM (roles/run_report, platform/report); nothing for hand-made instances.
    - name: Run report on the controller
      ansible.builtin.import_role:
        name: run_report
      tags: [always]
      when: spe_coder_workspace_id | length > 0 and not spe_local_apply

# The VM's work runs in overlapping lanes. As soon as Docker is up, the package
# install, the image pulls and the image builds (stack, sandbox, AG-UI) start in
# the background; the data copy and the seeding run meanwhile; every consumer
# joins the job it needs right before it needs it (the *_from: wait tasks).
# Each tag still selects one stage for a re-run against an existing instance.
# On the instance itself, `spe-apply stack|all|ansible` runs this playbook with
# the vars file role repo wrote at creation (spe_local_apply: true): no clone, no
# data copy, no hand-off; the stack, registrations and frontend roles re-apply the
# clone's current state.
- name: Configure the API instance
  hosts: spe_api
  gather_facts: false
  become: false
  pre_tasks:
    - name: Wait for SSH
      tags: [always]
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 5
    - name: Gather facts
      tags: [always]
      ansible.builtin.setup:
    - name: Wait for cloud-init
      tags: [always]
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false
    - name: Existing host is fit and free for this instance
      tags: [always]
      when: spe_provision == 'existing'
      block:
        - name: Passwordless sudo
          ansible.builtin.command: sudo -n true
          changed_when: false
        - name: Ownership, paths, ports, compose projects and disk
          # Read-only; see the script header for the rules.
          ansible.builtin.script:
            cmd: >-
              {{ playbook_dir }}/../roles/existing_host/files/spe_preflight.py
              {{ spe_preflight_cfg | to_json | b64encode }}
            executable: python3
          vars:
            spe_preflight_cfg:
              instance: "{{ spe_instance }}"
              provision: "{{ spe_manifest_provision }}"
              marker: /etc/spe-instance
              manifest: /etc/spe-instance.json
              paths:
                stack_dir: "{{ spe_stack_dir }}"
                frontend_dir: "{{ spe_frontend_dir }}"
                data_root: "{{ spe_data_root }}"
                repo_dir: "{{ spe_repo_dir }}"
              ports: "{{ spe_owned_ports }}"
              projects: "{{ spe_compose_projects }}"
              min_free_gb: "{{ spe_min_free_gb | int }}"
          register: spe_preflight_run
          changed_when: false
        - name: Preflight result
          ansible.builtin.set_fact:
            spe_preflight: "{{ spe_preflight_run.stdout | from_json }}"
        - name: Refuse a host that is not free for this instance
          ansible.builtin.assert:
            that: spe_preflight.problems | length == 0
            fail_msg: "{{ inventory_hostname }} refused, nothing changed: {{ spe_preflight.problems | join('; ') }}"
    - name: Deterministic service-info tokens
      tags: [always]
      ansible.builtin.set_fact:
        spe_svc_token_wes: "SVCINFO-{{ ((spe_seed | string ~ ':svc:wes') | hash('sha256'))[:10] | upper }}"
        spe_svc_token_drs: "SVCINFO-{{ ((spe_seed | string ~ ':svc:drs') | hash('sha256'))[:10] | upper }}"
        spe_svc_token_trs: "SVCINFO-{{ ((spe_seed | string ~ ':svc:trs') | hash('sha256'))[:10] | upper }}"
  tasks:
    - name: Baseline (Docker, packages, directories; seeding tools in the background)
      ansible.builtin.import_role:
        name: base
      become: true
      tags: [base]

    - name: Coder agent (first, so the portal shows the workspace connected early)
      ansible.builtin.import_role:
        name: coder_agent
      become: true
      tags: [coder]
      when: spe_coder_agent_token is defined

    - name: Image pulls in the background
      ansible.builtin.import_role:
        name: prefetch
      tags: [stack, frontend]

    - name: Repository clone (what the frontend runs from)
      ansible.builtin.import_role:
        name: repo
      tags: [frontend]

    - name: Certificate and trust anchor
      ansible.builtin.import_role:
        name: tls
      tags: [stack, frontend]

    - name: Sandbox image build in the background
      ansible.builtin.import_role:
        name: sandbox
      tags: [frontend]
      when: spe_frontends | length > 0

    - name: Stack sources and image builds in the background
      ansible.builtin.import_role:
        name: workflow_stack
        tasks_from: build
      tags: [stack]

    - name: Agent and chat UI image builds in the background
      ansible.builtin.import_role:
        name: agui
        tasks_from: build
      tags: [frontend]
      when: "'agui' in spe_frontends"

    - name: Data copy and seeding
      ansible.builtin.import_role:
        name: spe_data
      tags: [data]

    - name: Data checksums in the background
      ansible.builtin.import_role:
        name: drs_register
        tasks_from: hash
      tags: [drs]

    - name: Workflow stack
      ansible.builtin.import_role:
        name: workflow_stack
      tags: [stack]

    - name: DRS registration
      ansible.builtin.import_role:
        name: drs_register
      tags: [drs]

    - name: TRS workflows
      ansible.builtin.import_role:
        name: trs_install
      tags: [trs]

    # The frontends: each writes its configuration, one `spe-apply up` starts them
    # all with the shared sandbox, then each sets up what needs it running.
    - name: Open WebUI configuration
      ansible.builtin.import_role:
        name: openwebui
        tasks_from: config
      tags: [frontend]
      when: "'openwebui' in spe_frontends"

    - name: AG-UI configuration
      ansible.builtin.import_role:
        name: agui
        tasks_from: config
      tags: [frontend]
      when: "'agui' in spe_frontends"

    - name: Frontend containers up
      ansible.builtin.import_role:
        name: sandbox
        tasks_from: up
      tags: [frontend]
      when: spe_frontends | length > 0

    - name: Sandbox egress filter (spe_harden_egress)
      ansible.builtin.import_role:
        name: egress
      tags: [frontend]
      when: spe_frontends | length > 0

    # The canary ladder's test receiver (spe_eval_sink); its tasks take it down when off.
    - name: Test receiver
      ansible.builtin.import_role:
        name: eval_sink
      tags: [frontend]

    - name: Open WebUI frontend
      ansible.builtin.import_role:
        name: openwebui
      tags: [frontend]
      when: "'openwebui' in spe_frontends"

    - name: AG-UI frontend
      ansible.builtin.import_role:
        name: agui
      tags: [frontend]
      when: "'agui' in spe_frontends"

    - name: Hand-off files
      ansible.builtin.import_role:
        name: handoff
      tags: [handoff]

    - name: Verification
      ansible.builtin.import_role:
        name: verify
      tags: [verify]

    - name: Local re-apply tooling ready (collections installed in the background)
      ansible.builtin.import_role:
        name: repo
        tasks_from: wait
      tags: [frontend]
      when: not spe_local_apply
