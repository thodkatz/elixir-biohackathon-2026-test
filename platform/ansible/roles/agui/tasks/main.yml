---
# AG-UI agent frontend: chat-ui (Next.js + CopilotKit) and agent (Pydantic AI over
# AG-UI) in compose project spe-frontend, defined in the clone's
# platform/instance/compose.yml, driving the shared sandbox (role sandbox). The
# settings checks and the image builds happened earlier (build.yml, in the
# background), config.yml wrote the configuration, role sandbox (up.yml) started
# the containers. What is left: the checks.
- name: No-cost checks (the verify role repeats them and adds the smoke run)
  ansible.builtin.include_tasks: checks.yml
  vars:
    agui_run_smoke: false
