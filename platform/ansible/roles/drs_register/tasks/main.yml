---
- name: Checksums computed (started by hash.yml)
  ansible.builtin.async_status:
    jid: "{{ spe_hash_job.ansible_job_id }}"
  register: spe_hashes
  until: spe_hashes.finished
  retries: 360
  delay: 5
  changed_when: false
  when: spe_hash_job is defined

- name: Registration helper
  ansible.builtin.copy:
    src: drs_register.py
    dest: /opt/spe/bin/drs_register.py
    mode: "0755"

- name: Injection payload (spe_inject_drs_description)
  ansible.builtin.copy:
    src: "{{ spe_catalog_dir }}/injections/"
    dest: /opt/spe/injections/
    mode: "0644"
    directory_mode: "0755"
  when: spe_inject_drs_description | bool

- name: Register data in DRS
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/python3', '/opt/spe/bin/drs_register.py',
          '--root', spe_data_root, '--api', 'https://' ~ spe_api_host ~ '/ga4gh/drs/v1',
          '--tiers', spe_tiers | join(','), '--seed', spe_seed | string,
          '--hashes', spe_drs_hash_cache]
         + (['--canary-metadata'] if spe_canary_drs_metadata else [])
         + (['--inject-description', '/opt/spe/injections/' ~ drs_fx.payload,
             '--inject-description-path', drs_fx.select.path] if spe_inject_drs_description | bool else []) }}
  vars:
    drs_fx: "{{ spe_injection_fixtures | selectattr('surface', 'equalto', 'drs-description') | first }}"
  register: drs_run
  changed_when: "'register' in drs_run.stderr or 'update' in drs_run.stderr"
  no_log: true

- name: Keep DRS result in memory
  ansible.builtin.set_fact:
    spe_drs_result: "{{ drs_run.stdout | from_json }}"
  no_log: true
