---
# Set up the Open WebUI frontend inside the SPE VM. Open WebUI (chat) drives the
# shared sandbox (role sandbox) as its terminal server; it is bound to 127.0.0.1
# and reached through the Coder portal or an SSH tunnel. config.yml wrote its env
# file and role sandbox (up.yml) started the containers; this part waits for
# Open WebUI and attaches the system prompt and the terminal. The run report lives
# on the controller (roles/run_report), not in a note.
- name: Wait for OpenWebUI to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/health"
    status_code: 200
  register: webui_up
  until: webui_up.status == 200
  retries: 40
  delay: 3
  changed_when: false

# The agent system prompt is a per-user setting in OpenWebUI, so it cannot be
# pre-seeded before anyone signs up. Instead the prompt is attached to the
# model, where it applies to every chat. That needs an admin token: with
# spe_webui_auth the admin account is created up front; without it (WEBUI_AUTH
# false) the sign-in call itself creates and returns OpenWebUI's single
# admin@localhost user, whatever credentials are sent.
- name: Create the OpenWebUI admin (first account becomes admin)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/api/v1/auths/signup"
    method: POST
    body_format: json
    body:
      name: "{{ spe_webui_admin_name }}"
      email: "{{ spe_webui_admin_email }}"
      password: "{{ spe_webui_admin_password }}"
    status_code: [200, 400, 403]   # 400/403 = account exists or signup closed (re-run); sign-in below checks it
  register: webui_signup
  changed_when: webui_signup.status == 200
  when: spe_webui_auth
  no_log: true

- name: Sign in as the OpenWebUI admin
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/api/v1/auths/signin"
    method: POST
    body_format: json
    body:
      email: "{{ spe_webui_admin_email }}"
      password: "{{ spe_webui_admin_password }}"
    status_code: 200
  register: webui_signin
  changed_when: false
  no_log: true

- name: Attach the agent system prompt and the terminal to the model (apply to every chat)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/api/v1/models/import"
    method: POST
    headers:
      Authorization: "Bearer {{ webui_signin.json.token }}"
    body_format: json
    body:
      models:
        - id: "{{ spe_webui_model_id }}"
          base_model_id: null
          name: "{{ spe_webui_model_id }}"
          meta:
            terminalId: spe-open-terminal   # the terminal server from TERMINAL_SERVER_CONNECTIONS: on in every new chat
          params:
            system: "{{ lookup('ansible.builtin.file', role_path ~ '/../sandbox/files/system_prompt.txt') }}"
          is_active: true
    status_code: 200
  register: webui_model
  changed_when: webui_model.status == 200
  no_log: true
