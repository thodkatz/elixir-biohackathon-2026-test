---
# On the controller: write <spe_runs_root>/<UTC time>_<instance>/.
- name: Run directory
  ansible.builtin.file:
    path: "{{ spe_run_dir }}"
    state: directory
    mode: "0755"

- name: Parameters (run.yml)
  ansible.builtin.copy:
    dest: "{{ spe_run_dir }}/run.yml"
    mode: "0644"
    content: "{{ run_record | to_nice_yaml(indent=2, sort_keys=false) }}"
  vars:
    run_record:
      instance: "{{ spe_instance }}"
      archived_at: "{{ spe_archive_time }}"
      participant: "{{ spe_coder_owner }}"
      participant_email: "{{ spe_coder_owner_email }}"
      coder_workspace: "{{ spe_coder_workspace }}"
      seed: "{{ spe_seed }}"
      flavor: "{{ spe_flavor }}"
      samples: "{{ spe_samples }}"
      tiers: "{{ spe_tiers }}"
      workflows: "{{ spe_workflows }}"
      canaries: "{{ dict(query('ansible.builtin.varnames', '^spe_canary_') | map('regex_replace', '^spe_canary_', '')
                        | zip(query('ansible.builtin.varnames', '^spe_canary_') | map('extract', vars))) }}"
      weskit_branch: "{{ spe_weskit_branch }}"
      weskit_commit: "{{ spe_weskit_commit }}"
      model: "{{ spe_webui_model_id }}"
      llm_base_url: "{{ spe_llm_base_url }}"
      frontends: "{{ spe_frontends }}"

- name: Canary record
  ansible.builtin.copy:
    src: "{{ spe_output_dir }}/{{ item }}"
    dest: "{{ spe_run_dir }}/{{ item }}"
    mode: "0644"
  loop: [canaries.json, canaries.json.age, canaries.manifest.sha256]
  when: (spe_output_dir ~ '/' ~ item) is file

# The run report lives on the controller (roles/run_report, the portal's report
# service): a copy of its current state and of its sidecar goes into every run.
- name: Run report and its sidecar, as they are now
  ansible.builtin.copy:
    src: "{{ spe_reports_root }}/{{ spe_coder_workspace_id }}.{{ item }}"
    dest: "{{ spe_run_dir }}/report.{{ item }}"
    mode: "0644"
  loop: [md, json]
  when: spe_coder_workspace_id | length > 0 and (spe_reports_root ~ '/' ~ spe_coder_workspace_id ~ '.' ~ item) is file

- name: AG-UI chat sessions bundle
  ansible.builtin.stat:
    path: "{{ spe_output_dir }}/archive-bundle-agui.tar.gz"
  register: agui_bundle

- name: Unpack the AG-UI bundle
  when: agui_bundle.stat.exists
  block:
    - name: Remove a leftover bundle directory
      ansible.builtin.file:
        path: "{{ spe_output_dir }}/archive-bundle-agui"
        state: absent

    - name: Bundle directory
      ansible.builtin.file:
        path: "{{ spe_output_dir }}/archive-bundle-agui"
        state: directory
        mode: "0700"

    - name: Unpack
      ansible.builtin.command:
        argv: [tar, -xzf, "{{ spe_output_dir }}/archive-bundle-agui.tar.gz", -C, "{{ spe_output_dir }}/archive-bundle-agui"]
      changed_when: true

# AG-UI's part of the run lives in agui/ (journals, run log, rendered chats), apart
# from Open WebUI's chats/ and index.md: both frontends run on one instance. World-
# readable like the rest of the run: the portal's report service (its own user) serves
# the archive to logged-in participants (platform/report, the runs browser).
- name: AG-UI journals and the agent's run log, raw, in agui/ of the run directory
  when: agui_bundle.stat.exists
  block:
    - name: AG-UI directory
      ansible.builtin.file:
        path: "{{ spe_run_dir }}/agui"
        state: directory
        mode: "0755"

    - name: Journals directory
      ansible.builtin.file:
        path: "{{ spe_run_dir }}/agui/agui-journals"
        state: directory
        mode: "0755"

    - name: The journals, untouched (hidden and deleted sessions included; *.jsonl only, not other files there)
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ spe_run_dir }}/agui/agui-journals/"
        mode: "0644"
      loop: "{{ query('ansible.builtin.fileglob', spe_output_dir ~ '/archive-bundle-agui/agui-journals/*.jsonl') }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: The agent's run log, when a run reached the agent
      ansible.builtin.copy:
        src: "{{ spe_output_dir }}/archive-bundle-agui/agent-runs.jsonl"
        dest: "{{ spe_run_dir }}/agui/agent-runs.jsonl"
        mode: "0644"
      when: (spe_output_dir ~ '/archive-bundle-agui/agent-runs.jsonl') is file

- name: AG-UI chats, rendered from the exported bundle as an Open WebUI run, in agui/
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/write_run.py"
      - "{{ spe_output_dir }}/archive-bundle-agui/bundle.json"
      - "{{ spe_run_dir }}/agui"
  when: agui_bundle.stat.exists
  register: write_agui_out
  changed_when: true

- name: Chats and notes (and the report's state in index.md)
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/write_run.py"
      - "{{ spe_output_dir }}/archive-bundle.json"
      - "{{ spe_run_dir }}"
  when: (spe_output_dir ~ '/archive-bundle.json') is file
  register: write_out
  changed_when: true

- name: Overview without an Open WebUI export
  ansible.builtin.copy:
    dest: "{{ spe_run_dir }}/index.md"
    mode: "0644"
    content: |
      # Run {{ spe_run_dir | basename }}

      - Archived: {{ spe_archive_time }}
      - Frontends: {{ spe_frontends | join(", ") or "none" }}; no Open WebUI export (chats, notes)
      - Report: {{ '[report.md](report.md)' if (spe_run_dir ~ '/report.md') is file else 'missing (no portal workspace)' }}
      {% if agui_bundle.stat.exists %}
      - AG-UI chat sessions: [agui/](agui/index.md)
      {% endif %}
      - Parameters and canary record: [run.yml](run.yml), canaries.json
  when: not ((spe_output_dir ~ '/archive-bundle.json') is file)

- name: Remove the staged exports
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ spe_output_dir }}/archive-bundle.json"
    - "{{ spe_output_dir }}/archive-bundle-agui.tar.gz"
    - "{{ spe_output_dir }}/archive-bundle-agui"

- name: spe-eval's reports, promptfoo database and windows.jsonl (experiments spec part 03, decision 13)
  ansible.builtin.include_tasks: write_spe_eval.yml

- name: Archived
  ansible.builtin.debug:
    msg: >-
      Run saved to {{ spe_run_dir }} ({{ [write_out.stdout | default(''), write_agui_out.stdout | default('')]
      | select | join('; ') or 'no chat export' }})
