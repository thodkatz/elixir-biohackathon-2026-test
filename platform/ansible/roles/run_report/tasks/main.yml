---
# On the controller: the run report of a portal workspace, <spe_reports_root>/
# <workspace id>.md with its sidecar <workspace id>.json, served and edited through
# the portal's report service (platform/report) and copied into every run directory
# at stop (roles/run_archive). Both files are written once: a restart of the
# workspace leaves them alone (force: false). Instances without a workspace id
# (made by hand) get no report; create.yml skips this role for them and under
# spe_local_apply (a re-apply from the VM has no controller storage).
- name: Reports directory
  ansible.builtin.file:
    path: "{{ spe_reports_root }}"
    state: directory

- name: Render the template once (both files use it)
  ansible.builtin.set_fact:
    run_report_rendered: "{{ lookup('ansible.builtin.template', spe_report_template) }}"

- name: Run report (rendered once, never overwritten)
  ansible.builtin.copy:
    content: "{{ run_report_rendered }}"
    dest: "{{ spe_reports_root }}/{{ spe_coder_workspace_id }}.md"
    mode: "0664"
    force: false

- name: Report sidecar (owner, workspace, parameters; written once)
  ansible.builtin.copy:
    content: "{{ run_report_sidecar | to_nice_json(indent=2) }}\n"
    dest: "{{ spe_reports_root }}/{{ spe_coder_workspace_id }}.json"
    mode: "0664"
    force: false
  vars:
    run_report_sidecar:
      workspace_id: "{{ spe_coder_workspace_id }}"
      owner: "{{ spe_coder_owner }}"
      owner_email: "{{ spe_coder_owner_email }}"
      workspace: "{{ spe_coder_workspace }}"
      instance: "{{ spe_instance }}"
      created: "{{ now(utc=True).strftime('%Y-%m-%d %H:%M UTC') }}"
      template_sha256: "{{ run_report_rendered | hash('sha256') }}"
      parameters:
        flavor: "{{ spe_flavor }}"
        samples: "{{ spe_samples }}"
        tiers: "{{ spe_tiers }}"
        workflows: "{{ spe_workflows }}"
        frontends: "{{ spe_frontends }}"
        canaries: "{{ dict(run_report_canary_vars | map('regex_replace', '^spe_canary_', '')
                           | zip(run_report_canary_vars | map('extract', vars)))
                      | dict2items | selectattr('value') | map(attribute='key') | list }}"
    run_report_canary_vars: "{{ query('ansible.builtin.varnames', '^spe_canary_') }}"
