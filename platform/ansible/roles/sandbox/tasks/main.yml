---
# The agent's sandbox: the open-terminal image with this instance's own CA, built
# from the clone's Dockerfile. One container, driven by both frontends (Open WebUI
# as its terminal server, our agent as its tool surface). Also prepares the
# frontend directory: the .env that selects the frontends and the link to the
# compose file in the clone; each frontend role adds its configuration and secret
# env files (config.yml), then up.yml starts everything with one `spe-apply up`.
# The runbook, the helper scripts and the system prompt are not copied anywhere:
# the containers mount them from the clone. Runs right after role tls (the CA)
# and starts the build in the background (a 5.7 GB base image); up.yml joins it.
- name: Frontend directory
  ansible.builtin.file:
    path: "{{ spe_frontend_dir }}"
    state: directory
    owner: "{{ spe_ssh_user }}"
    group: "{{ spe_ssh_user }}"
    mode: "0750"

- name: Frontend selection, images and ports (.env, read by docker compose and spe-apply)
  ansible.builtin.template:
    src: frontend.env.j2
    dest: "{{ spe_frontend_dir }}/.env"
    owner: "{{ spe_ssh_user }}"
    group: "{{ spe_ssh_user }}"
    mode: "0644"

- name: Compose file is the clone's (a link, so edits to it are live)
  ansible.builtin.file:
    src: "{{ spe_repo_dir }}/platform/instance/compose.yml"
    dest: "{{ spe_frontend_dir }}/docker-compose.yml"
    state: link
    force: true
    owner: "{{ spe_ssh_user }}"
    group: "{{ spe_ssh_user }}"

- name: Sandbox Dockerfile from the clone (the build context is this directory)
  ansible.builtin.copy:
    src: "{{ spe_repo_dir }}/platform/ansible/roles/sandbox/files/Dockerfile.terminal"
    dest: "{{ spe_frontend_dir }}/Dockerfile.terminal"
    remote_src: true
    owner: "{{ spe_ssh_user }}"
    group: "{{ spe_ssh_user }}"
    mode: "0644"
  register: sandbox_ctx_files

- name: SPE trust anchor into the build context
  ansible.builtin.copy:
    src: "{{ spe_cert_dir }}/traefik.crt"
    dest: "{{ spe_frontend_dir }}/spe-ca.crt"
    remote_src: true
    owner: "{{ spe_ssh_user }}"
    group: "{{ spe_ssh_user }}"
    mode: "0644"
  register: sandbox_ca_file

# The same command the workspace's Rebuild button runs (spe-apply, linked by role
# repo), so the images it builds later are cache hits and nothing is recreated.
- name: Build the open-terminal image with the SPE CA, in the background (spe-apply build sandbox)
  ansible.builtin.command: spe-apply build sandbox
  async: 3600
  poll: 0
  register: sandbox_build_job
  changed_when: false   # the join (wait.yml) reports the change
