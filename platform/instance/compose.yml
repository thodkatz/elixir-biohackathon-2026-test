# The chat frontends of an SPE instance: compose project spe-frontend.
# Lives in the repository clone on the VM and is linked into the frontend
# directory (spe_frontend_dir/docker-compose.yml), whose .env selects what runs
# through COMPOSE_PROFILES and sets every ${VAR} below:
#   openwebui       Open WebUI
#   agui,ui         our agent + the built chat UI
#   agui,ui-dev     our agent + the chat UI as a dev server (hot reload)
#   evals           evals-view: a read-only `promptfoo view` on spe_experiments builds only
# Both frontends drive the same sandbox (service sandbox, profiles openwebui and
# agui): one open-terminal container, one home directory, whichever chat the
# person uses. Everything the agent and the sandbox read at run time is mounted
# from the clone, so an edit there is live without a rebuild: the runbook and
# helper scripts (/opt/agent), the agent's prompt and its Python source. Secrets
# come from the env files next to the .env, written by Ansible.
name: spe-frontend
services:
  # --- Open WebUI frontend --------------------------------------------------
  open-webui:
    profiles: [openwebui]
    image: ${SPE_WEBUI_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SPE_WEBUI_PORT}:8080"
    env_file: webui.env
    environment:
      ENABLE_OLLAMA_API: "false"
      # Preselected model for new chats (the one carrying the system prompt,
      # see roles/openwebui) and first in the model picker.
      DEFAULT_MODELS: ${SPE_WEBUI_MODEL_ID}
      MODEL_ORDER_LIST: '["${SPE_WEBUI_MODEL_ID}"]'
      WEBUI_AUTH: ${SPE_WEBUI_AUTH}
      ENABLE_SIGNUP: ${SPE_WEBUI_AUTH}
      DEFAULT_USER_ROLE: pending
      ENABLE_CODE_INTERPRETER: "false"
      # Tags are set by hand as outcome labels (see reports/run_report.md.j2);
      # LLM-generated tags would mix with them.
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_CODE_EXECUTION: "false"
      AIOHTTP_CLIENT_STREAM_IDLE_TIMEOUT: "120"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - sandbox
    networks: [tools]
    volumes:
      - open-webui-data:/app/backend/data

  # --- AG-UI frontend --------------------------------------------------------
  chat-ui:
    profiles: [ui]
    image: ${SPE_CHAT_UI_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SPE_AGUI_UI_PORT}:3000"
    env_file: chat-ui.env
    volumes:
      # Chat sessions, one append-only journal each (/data/sessions/<id>.jsonl); private like agent-runs.
      - chat-sessions:/data
    networks: [ui]
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
  chat-ui-dev:
    # The chat UI from its source in the clone, served by `next dev`: a saved file
    # reloads in the browser. node_modules and .next live in volumes so the clone
    # stays clean; both are owned by uid 1000 (node in the image, the VM user outside).
    profiles: [ui-dev]
    image: node:26-slim
    restart: unless-stopped
    working_dir: /app
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/sessions &&
        chown node:node /app/node_modules /app/.next /data /data/sessions &&
        exec su -s /bin/sh node -c
        'npm install --no-audit --no-fund && exec npm run dev -- --hostname 0.0.0.0 --port 3000'
    ports:
      - "127.0.0.1:${SPE_AGUI_UI_PORT}:3000"
    env_file: chat-ui.env
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      DO_NOT_TRACK: "1"
      npm_config_cache: /tmp/npm-cache
    networks: [ui]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512
    volumes:
      - ${SPE_REPO_DIR}/platform/agui/copilotkit-chat:/app
      - chat-ui-node-modules:/app/node_modules
      - chat-ui-next:/app/.next
      # The same sessions as the built chat UI, so switching profiles keeps them.
      - chat-sessions:/data
  agent:
    profiles: [agui]
    image: ${SPE_AGENT_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SPE_AGUI_AGENT_PORT}:8100"
    env_file: agent.env
    environment:
      # 1: a saved .py file under /app/src restarts the server (uvicorn reload).
      SPE_AGENT_RELOAD: ${SPE_AGENT_RELOAD:-0}
    labels:
      # agent.yaml is a bind mount: a change to it alone would not recreate the
      # container, so its hash is part of the configuration (spe-apply sets it).
      spe.agent-config: ${SPE_AGENT_CONFIG_HASH:-}
    volumes:
      - ./agent.yaml:/etc/spe-agent/agent.yaml:ro
      # The prompt: the directory, not the file, so an editor that replaces the file is seen.
      - ${SPE_REPO_DIR}/platform/ansible/roles/sandbox/files:/etc/spe-agent/sandbox:ro
      - ${SPE_REPO_DIR}/platform/agui/pydantic-ai-agent/src:/app/src:ro
      - agent-runs:/var/lib/spe-agent
    networks: [ui, tools]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256

  # --- the sandbox, shared by both frontends -----------------------------------
  sandbox:
    profiles: [openwebui, agui]
    image: ${SPE_TERMINAL_IMAGE}
    restart: unless-stopped
    env_file: terminal.env
    environment:
      OPEN_TERMINAL_FILE_BROWSER_ROOT: /home/user
    networks: [tools]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    volumes:
      - open-terminal-data:/home/user
      # The runbook and helper scripts the agent runs, live from the clone.
      - ${SPE_REPO_DIR}/platform/ansible/roles/sandbox/files/agent:/opt/agent:ro

  # --- evals-view: a read-only `promptfoo view` on spe_experiments builds (decisions 14-15,
  # docs/specs/2026-11-10-experiments-design/04-viewer.md) --------------------------------
  # The entry point: a stock nginx, configuration only (evals-view/nginx.conf), proxying
  # GET/HEAD everywhere and socket.io's own POST, 403 to everything else -- including every
  # write `promptfoo view` itself would otherwise accept. Publishes the only port; promptfoo
  # (below) shares its network namespace instead of joining the `evals` network itself: the
  # proxy guards the published entry point, nothing reaches promptfoo's own port without going
  # through it first (though not a boundary against the VM host itself, which can always reach
  # any container directly).
  #
  # Every SPE_EVALS_* variable below has a default: compose interpolates and parses every
  # service, including one in an inactive profile (`evals` here, only on spe_experiments
  # builds), so a plain spe build's .env -- which has none of these -- must still parse
  # (fix round 1, Critical 1; platform/dev/tests/test_evals_view.py's
  # test_compose_loads_without_any_spe_evals_variable checks this). The defaults are never used
  # by a running container: this profile is simply never active on such a build.
  evals-view:
    profiles: [evals]
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SPE_EVALS_PORT:-8200}:8080"
    volumes:
      - ${SPE_REPO_DIR}/platform/instance/evals-view/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [evals]
    # The image's own non-root "nginx" user (uid/gid 101), throughout: no privileged master
    # process to drop from, so no capability is needed (evals-view/nginx.conf has no "user"
    # directive either).
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
  evals-promptfoo:
    profiles: [evals]
    image: ${SPE_EVALS_VIEW_IMAGE:-spe-evals-view:local}
    restart: unless-stopped
    # Shares evals-view's network namespace instead of joining a network of its own: nothing
    # on the `evals` network, or any other, reaches this port directly, only evals-view's proxy
    # in front of it (not a boundary against the VM host itself, which can always reach any
    # container's own interfaces).
    network_mode: "service:evals-view"
    environment:
      # No sharing, telemetry or self-update from an SPE instance; baked into the image too
      # (evals-view/Dockerfile), repeated here so a build without these is visible in the
      # compose config itself (platform/dev/tests/test_evals_view.py).
      PROMPTFOO_DISABLE_SHARING: "1"
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
    volumes:
      # The host's evaluations directory (docs/specs/2026-11-10-experiments-design/04-viewer.md),
      # the same PROMPTFOO_CONFIG_DIR a run itself writes (read-write: promptfoo view runs its
      # own DB migrations at start). The default is a placeholder, never read on a build where
      # this profile is inactive (see the comment above evals-view).
      - ${SPE_EVALS_DATA_DIR:-/nonexistent-spe-evals-data}:/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
networks:
  ui: {}      # chat-ui <-> agent
  tools: {}   # open-webui and agent <-> sandbox
  evals: {}   # evals-view's own entry point; evals-promptfoo shares its netns instead of joining
volumes:
  open-webui-data: {}
  open-terminal-data: {}
  agent-runs: {}
  chat-sessions: {}
  chat-ui-node-modules: {}
  chat-ui-next: {}
