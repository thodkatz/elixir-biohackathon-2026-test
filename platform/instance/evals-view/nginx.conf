# evals-view's entry point: a read-only proxy in front of `promptfoo view` (decision 15,
# docs/specs/2026-11-10-experiments-design/04-viewer.md). GET and HEAD go through everywhere;
# socket.io's own transport also needs its long-polling POST (the server only emits "init"/
# "update", it handles no client event) and the websocket upgrade on GET. Every other request
# -- in particular the writes `promptfoo view` itself offers (POST /api/eval/job, POST
# /api/eval/replay, PATCH/DELETE /api/eval/:id, POST /api/user/email, ...) -- gets a plain 403
# here, before it reaches promptfoo. Settled against 0.125.1's routes by
# platform/dev/tests/test_evals_view.py. No code of ours: this is nginx configuration, an
# allow-list of methods and paths.
#
# Runs as nginx:1.29-alpine's own non-root "nginx" user throughout (compose.yml sets
# `user: "101:101"`), so there is no privileged master process to drop from: no "user"
# directive, no capability this container needs (cap_drop: [ALL] in compose.yml). The root
# filesystem is read-only (compose.yml); pid and nginx's temp directories go to the /tmp tmpfs.
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    # Unused (no fastcgi/uwsgi/scgi here) but nginx still creates every compiled-in temp
    # directory at start-up; without these three it fails on the read-only root filesystem.
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # evals-promptfoo, in this container's own network namespace (compose.yml:
    # network_mode: "service:evals-view"): nothing on the `evals` network, or any other,
    # reaches it directly, only this proxy (not a boundary against the VM host itself, which
    # can always reach any container's own interfaces).
    upstream promptfoo {
        server 127.0.0.1:15500;
    }

    # The standard nginx websocket-proxying idiom: "Connection: upgrade" only on a request
    # that actually asks to upgrade, "close" on socket.io's own plain long-polling GET/POST
    # (an unconditional "upgrade" would mislabel those).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        # Both locations forward $uri (nginx's own decoded, dot-segment-resolved path), not the
        # client's raw request URI (fix round 1, Important 2). `proxy_pass http://promptfoo;`
        # alone forwards the raw bytes unchanged, but nginx picks *which* location (and so
        # which methods are allowed) from the decoded, normalized path: a request like
        # `POST /api/redteam/..%2F..%2Fsocket.io%2F` normalizes to exactly /socket.io/ (nginx
        # decodes %2F into a real "/" before resolving ".." across it) and so is matched and
        # allowed here, by this location -- but forwarded raw, Express never decodes %2F as a
        # separator, and dispatches it to `redteamRouter.post("/:taskId")` with
        # taskId="../../socket.io/" instead: a write nginx's own allow-list meant to refuse.
        # Forwarding $uri$is_args$args instead sends promptfoo exactly the same path nginx
        # itself decided on, so the two can never disagree about where a request goes.
        location /socket.io/ {
            limit_except GET POST {
                deny all;
            }
            proxy_pass http://promptfoo$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            # It is not necessary to list HEAD: nginx allows it automatically wherever GET is
            # allowed.
            limit_except GET {
                deny all;
            }
            proxy_pass http://promptfoo$uri$is_args$args;
            proxy_set_header Host $host;
        }
    }
}
