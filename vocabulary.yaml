# Controlled vocabularies for threat model entries (threats/TM-*.md).
# validate.py checks the frontmatter fields `status`, `entry-points`,
# `assets` and `stride` against the keys below.
#
# Extending: add a new key with a one-line description. Check for existing
# synonyms first (e.g. don't add `user-data` next to `user-records`).
# `stride` is a fixed external standard - do NOT extend it.

status:
  hypothesised: Written down; not yet attempted on an instance
  reproduced: Demonstrated on an instance by a promptfoo test or an archived run
  mitigated: A control on the instance blocks the reproduced scenario, confirmed by a promptfoo test

entry-points:
  user-prompt: The user's own instructions in the chat
  pasted-text: Text the user copies into the chat from somewhere else
  uploaded-file: A file the user attaches to the chat
  web-content: A page the agent, or a command in its sandbox, fetches from the internet
  tool-output: What the agent's tools return (API responses, run logs, files it reads)
  mcp-server: Tool descriptions and results from a tool server the user connected (MCP or OpenAPI)
  client-history: The conversation history the chat client sends with each run (AG-UI, chat completions), and the rest of that run input (tools, state, context)

assets:
  user-records: Personal or account data of end users
  credentials: "Secrets: passwords, API keys, tokens, certificates"
  internal-documents: Non-public organizational content (docs, wikis, tickets)
  source-code: Application or infrastructure code
  model-weights: Trained model parameters
  system-prompt: Agent instructions / configuration prompts
  conversation-history: Prior messages, agent memory of past sessions
  compute-resources: CPU/GPU time, API quota, budget
  external-systems: Third-party systems the agent can reach (APIs, websites)
  agent-integrity: Correctness of the agent's own behavior/outputs

stride:
  spoofing: Pretending to be another user, service or tool (authenticity)
  tampering: Changing data, code or instructions without permission (integrity)
  repudiation: Acting without leaving evidence of who did it, or destroying that evidence (non-repudiation)
  information-disclosure: Exposing data to someone who should not see it (confidentiality)
  denial-of-service: Making a system or resource unavailable, or using it up (availability)
  elevation-of-privilege: Gaining access or abilities beyond what was granted (authorization)
